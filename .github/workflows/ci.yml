name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install .
      - name: Compile
        run: python -m py_compile core.py mcp_lab.py scenarios.py tactics.py web_ui.py
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: v1 campaign and evidence smoke test
        run: agentsim campaign run endpoint-discovery-baseline --mode simulate --target synthetic://ci --authorization examples/authorization.simulate.json --output-dir smoke-campaign-runs --database smoke-runs.db
      - name: v1.7 assurance, portability, trust, detection, and lab interfaces
        run: |
          agentsim detection generate endpoint.discovery.processes --format sigma
          agentsim detection samples --output smoke-detection-samples.json
          agentsim detection sample-export smoke-detection-sample-library --format sigma --format kql --alert-profile generic --alert-profile sentinel
          agentsim lab run all --output smoke-agentic-lab.json
          agentsim lab reference all --output smoke-reference-lab.json
          agentsim telemetry mappings
          agentsim lab conformance multi-agent-delegation-cascade --output smoke-conformance.json --fail-on-error
          agentsim content review examples/community-ability-pack.signed.json --trust-store examples/community-trust-store.json --output smoke-community-review.json --fail-on review
          agentsim lab artifact-review labs/reference-agent/artifacts/synthetic-marker.reference.json --lab-root labs/reference-agent/artifacts --output smoke-artifact-review.json
          agentsim telemetry query elastic --base-url https://elastic.example.test --dataset logs-test --target host-test --since 2026-08-02T00:00:00Z --until 2026-08-02T00:05:00Z --output smoke-live-query-plan.json
          agentsim attack-flow export endpoint-discovery-baseline --output smoke-attack-flow.json
          agentsim external plan stratus-red-team --provider-version 2.17.0 --target cloud://aws/security-sandbox --technique-id aws.discovery.ec2-describe-instances --output smoke-external-plan.json
      - name: Smoke test
        run: python core.py --dry-run --iterations 3 --speed 0 --seed 42 --output smoke-layer.json
      - name: Scenario smoke test
        run: python core.py --scenario all --variant both --mutations 1 --mutation-seed 42 --speed 0 --ground-truth-output smoke-events.jsonl --validation-output smoke-validation.json
      - name: Telemetry assurance and detection-pack smoke test
        run: |
          agentsim telemetry doctor smoke-events.jsonl --collector agent_runtime --output smoke-assurance.json --fail-on degraded
          agentsim telemetry investigate smoke-events.jsonl --collector agent_runtime --output smoke-investigation.json --fail-on never
          agentsim detection sweep smoke-events.jsonl --collector agent_runtime --output smoke-detection-sweep.json
          agentsim defense drift smoke-validation.json smoke-validation.json --output smoke-detection-drift.json
          agentsim telemetry record smoke-events.jsonl --format agent_runtime --runtime scenario-ci --classification malicious --output smoke-flight.json --twin-output smoke-flight-twin.jsonl
          agentsim detection ci smoke-flight.json smoke-flight.json --classification malicious --output smoke-detection-ci.json --markdown-output smoke-detection-ci.md --junit-output smoke-detection-ci.xml --sarif-output smoke-detection-ci.sarif --fail-on block
      - name: MCP boundary smoke test
        run: python core.py --mcp-lab --mcp-lab-output smoke-mcp-lab.json
      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: agentsim-evidence-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            agent_sim_evidence.zip
            smoke-mcp-lab.json
            smoke-agentic-lab.json
            smoke-reference-lab.json
            smoke-conformance.json
            smoke-community-review.json
            smoke-artifact-review.json
            smoke-assurance.json
            smoke-detection-sweep.json
            smoke-detection-samples.json
            smoke-detection-sample-library/manifest.json
            smoke-detection-drift.json
            smoke-flight.json
            smoke-flight-twin.jsonl
            smoke-detection-ci.json
            smoke-detection-ci.md
            smoke-detection-ci.xml
            smoke-detection-ci.sarif
            smoke-live-query-plan.json
            smoke-attack-flow.json
            smoke-external-plan.json
            smoke-campaign-runs/*/evidence.zip

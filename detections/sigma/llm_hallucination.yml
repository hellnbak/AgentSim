title: Cross-OS Discovery Command Executed Through Native Shell
id: 2d9a9ec4-f3b6-47cf-a378-d56d7f119dd6
status: experimental
description: >
  Detects Windows shells carrying common Unix discovery syntax or POSIX shells
  carrying common Windows discovery syntax, as generated by AgentSim.
author: AgentSim contributors
date: 2026-08-01
tags:
  - attack.discovery
logsource:
  category: process_creation
detection:
  windows_shell:
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
  unix_syntax:
    CommandLine|contains:
      - 'cat /etc/passwd'
      - 'uname -a'
      - 'ps aux'
      - 'ls -la'
  posix_shell:
    Image|endswith:
      - '/bash'
      - '/sh'
  windows_syntax:
    CommandLine|contains:
      - 'dir C:\Windows\System32'
      - 'ipconfig /all'
      - 'net user administrator'
      - 'tasklist'
  condition: (windows_shell and unix_syntax) or (posix_shell and windows_syntax)
falsepositives:
  - WSL or compatibility layers
  - Cross-platform build and test automation
  - Administrator command-line testing
level: medium

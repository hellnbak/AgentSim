[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentsim"
version = "0.2.0"
description = "Defensive telemetry and ground-truth simulation for autonomous agents"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
keywords = ["agentic-ai", "detection-engineering", "security", "simulation", "mitre-attack"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
]
dependencies = ["Flask>=3.1,<4.0"]

[project.scripts]
agentsim = "core:main"
agentsim-web = "web_ui:main"

[tool.setuptools]
py-modules = ["core", "scenarios", "tactics", "web_ui"]

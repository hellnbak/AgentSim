name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install .
      - name: Compile
        run: python -m py_compile core.py mcp_lab.py scenarios.py tactics.py web_ui.py
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: v1 campaign and evidence smoke test
        run: agentsim campaign run endpoint-discovery-baseline --mode simulate --target synthetic://ci --authorization examples/authorization.simulate.json --output-dir smoke-campaign-runs --database smoke-runs.db
      - name: v1 detection and lab interfaces
        run: |
          agentsim detection generate endpoint.discovery.processes --format sigma
          agentsim lab run all --output smoke-agentic-lab.json
          agentsim attack-flow export endpoint-discovery-baseline --output smoke-attack-flow.json
          agentsim external plan stratus-red-team --provider-version 2.17.0 --target cloud://aws/security-sandbox --technique-id aws.discovery.ec2-describe-instances --output smoke-external-plan.json
      - name: Smoke test
        run: python core.py --dry-run --iterations 3 --speed 0 --seed 42 --output smoke-layer.json
      - name: Scenario smoke test
        run: python core.py --scenario all --variant both --mutations 1 --mutation-seed 42 --speed 0 --ground-truth-output smoke-events.jsonl --validation-output smoke-validation.json
      - name: MCP boundary smoke test
        run: python core.py --mcp-lab --mcp-lab-output smoke-mcp-lab.json
      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: agentsim-evidence-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            agent_sim_evidence.zip
            smoke-mcp-lab.json
            smoke-agentic-lab.json
            smoke-attack-flow.json
            smoke-external-plan.json
            smoke-campaign-runs/*/evidence.zip
